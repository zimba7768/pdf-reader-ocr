[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-reader-ocr"
version = "0.1.0"
description = "A free, open-source PDF reader for Windows with built-in OCR (Tesseract)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]
test = ["pytest>=8"]

[project.scripts]
pdf-reader-ocr = "pdf_reader_ocr.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_reader_ocr = ["resources/*"]
